<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SpellBook – Prototype UI</title>
  <style>
    :root {
      --c-red: #e23b2f;
      --c-red-dark: #b1261c;
      --c-yellow: #ffd54a;
      --c-yellow-deep: #ffbf00;
      --c-blue: #00e6c3;
      --c-blue-deep: #003a33;
      --c-key-blue: #26a7ff;
      --c-key-orange: #ff8f2a;
      --c-key-green: #29cc7a;
      --c-key-pink: #ff4fad;
      --c-black: #121212;
      --c-panel: #1a1a1a;
      --c-bg: linear-gradient(120deg, #2b2b2b 0%, #38345b 50%, #342a3b 100%);
      --radius: 22px;
      --shadow: 0 12px 30px rgba(0,0,0,.35);
    }* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial;
  background: var(--c-bg);
  color: #fff;
  display: grid;
  place-items: center;
}

.tablet {
  width: min(1100px, 96vw);
  height: min(760px, 92vh);
  background: var(--c-red);
  border-radius: calc(var(--radius) + 8px);
  box-shadow: var(--shadow);
  border: 6px solid var(--c-red-dark);
  padding: 14px;
  display: grid;
  grid-template-columns: 1fr 1.2fr;
  gap: 14px;
  position: relative;
}

.handle {
  position: absolute; inset: -34px auto auto 50%; transform: translateX(-50%);
  width: 52%; height: 60px; border-radius: 40px; background: var(--c-red);
  border: 6px solid var(--c-red-dark);
  box-shadow: 0 8px 16px rgba(0,0,0,.2) inset;
}

.left-pane {
  background: #232028;
  border-radius: var(--radius);
  padding: 20px;
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: 18px;
  border: 4px solid #3d3656;
  background-image: linear-gradient(180deg, #2a2634, #1d1a24);
  position: relative;
}

.badge {
  align-self: start;
  justify-self: start;
  background: conic-gradient(from 90deg at 50% 50%, #ff66c4, #6de7ff, #ffe66d, #ff66c4);
  color: #111;
  padding: 6px 12px;
  font-weight: 700;
  border-radius: 14px;
  letter-spacing: .02em;
  box-shadow: 0 4px 14px rgba(0,0,0,.2);
}

.speaker-box {
  background: var(--c-panel);
  border-radius: 16px;
  padding: 12px;
  box-shadow: inset 0 6px 24px rgba(0,0,0,.65);
  position: relative;
  height: 54%;
}

.grill {
  width: 100%; height: 100%; border-radius: 12px;
  background:
    radial-gradient(#000 28%, transparent 30%) 0 0/14px 14px,
    radial-gradient(#000 28%, transparent 30%) 7px 7px/14px 14px,
    linear-gradient(#2a2a2a, #181818);
  border: 2px solid #101010;
  position: relative;
}

.mic {
  align-self: end;
  justify-self: center;
  width: 220px; height: 220px;
  position: relative;
  filter: drop-shadow(0 10px 20px rgba(0,0,0,.45));
  display: flex;
  flex-direction: column;
  align-items: center;
}
.mic .head {
  width: 150px; height: 180px; border-radius: 80px;
  background: linear-gradient(180deg,#cfd3db,#8a8f99);
  border: 5px solid #5c6069;
  overflow: hidden;
  position: relative;
}
.mic .slots {
  position: absolute; inset: 16px; border-radius: 60px;
  background: repeating-linear-gradient(#444 0 6px, #2b2f36 6px 12px);
  box-shadow: inset 0 0 0 4px rgba(0,0,0,.3);
}
.mic .stem {
  width: 18px; height: 50px; background: #666; margin-top: -4px; border-radius: 10px;
  box-shadow: inset 0 -4px 6px rgba(0,0,0,.4);
}
.mic .base {
  width: 120px; height: 18px; background: #7a7f8a; margin-top: 8px; border-radius: 12px;
  box-shadow: inset 0 -4px 6px rgba(0,0,0,.5);
}

.record-btn {
  margin-top: 16px;
  background: radial-gradient(circle at 30% 30%, #ff7676, #d41c1c 70%);
  border: 4px solid #7a0c0c;
  border-radius: 50%;
  width: 64px; height: 64px;
  box-shadow: 0 0 12px rgba(255,0,0,.6);
  cursor: pointer;
  transition: transform .1s ease-in-out;
}
.record-btn:active { transform: scale(0.95); }

.right-pane {
  background: var(--c-yellow);
  border-radius: var(--radius);
  border: 6px solid var(--c-yellow-deep);
  padding: 16px 16px 12px;
  display: grid;
  grid-template-rows: auto auto 1fr auto;
  gap: 12px;
  position: relative;
}

.brandbar {
  display: flex; align-items: center; justify-content: space-between;
  background: linear-gradient(180deg, #ffe571, #ffcf46);
  padding: 8px 12px; border-radius: 12px;
  border: 3px solid #f7bd22;
}
.logo { font-weight: 900; font-size: 22px; color: #6a1b9a; }
.tagline { font-size: 12px; color: #8a2be2; font-weight: 700; }

.vfd {
  background: linear-gradient(180deg, #0b1f1b, #031412);
  border: 6px solid #0a2a24; border-radius: 14px;
  height: 78px; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between;
  box-shadow: inset 0 -6px 14px rgba(0,0,0,.6);
  position: relative;
}
.vfd::after {
  content: ""; position: absolute; inset: 0; border-radius: 10px;
  background: linear-gradient(180deg, rgba(255,255,255,.06), transparent 42%);
}
.vfd .text {
  font-family: "Courier New", monospace;
  font-size: 28px; letter-spacing: .22em;
  color: var(--c-blue);
  text-shadow: 0 0 6px rgba(0,230,195,.7), 0 0 18px rgba(0,230,195,.35);
  white-space: nowrap;
}
.signal {
  width: 18px; height: 18px; border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #9cffea, #00e6c3 40%, #038e77 100%);
  box-shadow: 0 0 8px rgba(0,230,195,.7);
}

.keypad {
  background: #f8f0b6;
  border: 4px solid #ffd54a;
  border-radius: 16px;
  padding: 12px;
  display: grid;
  grid-template-rows: auto auto 1fr;
  gap: 12px;
  box-shadow: inset 0 8px 18px rgba(0,0,0,.08);
}

.fn-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.keys { display: grid; grid-template-columns: repeat(10, 1fr); gap: 8px; }
.big-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

.btn {
  border: 2px solid rgba(0,0,0,.25);
  border-bottom-width: 4px;
  border-radius: 12px;
  padding: 10px 8px; text-align: center; font-weight: 800;
  font-size: 16px; text-transform: uppercase;
  color: #111;
  user-select: none; cursor: default;
}
.btn:active { transform: translateY(1px); border-bottom-width: 3px; }

.btn.blue { background: var(--c-key-blue); }
.btn.orange { background: var(--c-key-orange); }
.btn.green { background: var(--c-key-green); }
.btn.pink { background: var(--c-key-pink); }
.btn.gray { background: #d6d6d6; }

.footer {
  display: flex; justify-content: space-between; align-items: center;
}
.badge-era {
  background: #ff66c4; color: #190c25; font-weight: 900; padding: 4px 8px; border-radius: 8px;
  border: 2px solid #f049b0; font-size: 12px;
}

@media (max-width: 900px) {
  .tablet { grid-template-columns: 1fr; height: auto; }
  .handle { display: none; }
  .mic { width: 180px; height: 180px; }
  .vfd .text { font-size: 22px; }
}

  </style>
</head>
<body>
  <div class="tablet">
    <div class="handle" aria-hidden="true"></div><section class="left-pane">
  <div class="badge">Audio Console</div>
  <div class="speaker-box"><div class="grill"></div></div>

  <div class="mic">
    <div class="head"><div class="slots"></div></div>
    <div class="stem"></div>
    <div class="base"></div>
    <button class="record-btn" aria-label="Record"></button>
  </div>
</section>

<section class="right-pane">
  <div class="brandbar">
    <div class="logo">SpellBook</div>
    <div class="tagline">Say it · Type it</div>
  </div>

  <div class="vfd"><div class="text">SPELL A ___</div><div class="signal"></div></div>

  <div class="keypad">
    <div class="fn-row">
      <div class="btn gray" id="power">Power</div>
      <div class="btn gray" id="spell">Spell</div>
      <div class="btn orange" id="replay">Replay</div>
      <div class="btn orange" id="repeat">Repeat</div>
      <div class="btn blue" id="say">Say</div>
      <div class="btn pink" id="check">Check</div>
    </div>
    <div class="keys">
      <div class="btn green">A</div><div class="btn green">B</div><div class="btn green">C</div><div class="btn green">D</div><div class="btn green">E</div>
      <div class="btn green">F</div><div class="btn green">G</div><div class="btn green">H</div><div class="btn green">I</div><div class="btn green">J</div>
      <div class="btn green">K</div><div class="btn green">L</div><div class="btn green">M</div><div class="btn green">N</div><div class="btn green">O</div>
      <div class="btn green">P</div><div class="btn green">Q</div><div class="btn green">R</div><div class="btn green">S</div><div class="btn green">T</div>
      <div class="btn green">U</div><div class="btn green">V</div><div class="btn green">W</div><div class="btn green">X</div><div class="btn green">Y</div><div class="btn green">Z</div>
    </div>
    <div class="big-row">
      <div class="btn gray">Erase</div>
      <div class="btn blue">Space</div>
      <div class="btn pink">Enter</div>
    </div>
  </div>

  <div class="footer">
    <div class="badge-era">retro 1979–98</div>
    <div style="font-weight:700; color:#6a1b9a;">ui prototype · no functionality yet</div>
  </div>
</section>

  </div>

<script src="js/spellbook.js"></script>
</body>
</html>
